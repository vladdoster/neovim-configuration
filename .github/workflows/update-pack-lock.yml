name: 'Update nvim-pack-lock.json'
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Installing libraries
        run: sudo apt install -y git curl wget luajit build-essential libfuse-dev fzf fd-find ripgrep

      - name: setup git config
        run: |
          git config user.name "vladdoster"
          git config user.email "mvdoster@gmail.com"

      - name: install neovim
        run: |
          sudo snap install nvim --classic

      - name: run pack sync
        shell: bash
        run: |
          # Initial install (vim.pack prompts for confirmation by default; our
          # orchestrator calls vim.pack.add with confirm = false so a headless
          # invocation will install non-interactively).
          nvim --headless +q
          nvim --headless +q
          nvim --headless '+checkhealth' -c 'qa'
          make update

      - name: check if update
        id: lockfile-update-check
        run: |
          git diff --exit-code --quiet nvim-pack-lock.json

      - name: commit
        if: ${{ steps.lockfile-update-check.conclusion == 'failure' }}
        run: |
          git add nvim-pack-lock.json
          git commit --message "build: update nvim-pack-lock.json" --signoff
          git push origin master
